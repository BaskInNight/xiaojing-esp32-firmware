<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#07111f"/>
  <style>
    .panel{fill:#10283a;stroke:#2fd7e8;stroke-width:2}
    .panel2{fill:#0c2030;stroke:#315064;stroke-width:2}
    .title{font:600 12px 'Microsoft YaHei','SimHei',sans-serif;fill:#f4fbff}
    .sub{font:9px 'Microsoft YaHei','SimHei',sans-serif;fill:#8ba8b7}
    .cyan{fill:#2fd7e8}.green{fill:#54e39a}.orange{fill:#ffb45c}
    .tiny{font:9px 'Microsoft YaHei','SimHei',sans-serif;fill:#d9ecf3}
    .value{font:600 11px 'Microsoft YaHei','SimHei',sans-serif;fill:#f4fbff}
  </style>

  <!-- fixed header: heartbeat at x=234, page number at the far right -->
  <rect class="panel" x="8" y="6" width="304" height="38" rx="5"/>
  <text class="title" x="20" y="30">外设遥测 / 仪表</text>
  <circle cx="232" cy="25" r="5" fill="#54e39a" stroke="#54e39a" stroke-width="1"/>
  <text class="title" x="246" y="29">03 / 04</text>

  <!-- water and drum gauges -->
  <rect class="panel2" x="8" y="52" width="149" height="76" rx="5"/>
  <circle cx="38" cy="90" r="20" fill="none" stroke="#2fd7e8" stroke-width="5"/>
  <text class="value" x="65" y="87">水量 --ml</text><text class="sub" x="65" y="108">流量 --</text>

  <rect class="panel2" x="163" y="52" width="149" height="76" rx="5"/>
  <circle cx="193" cy="90" r="20" fill="none" stroke="#54e39a" stroke-width="5"/>
  <text class="value" x="220" y="87">位置 --/--</text>
  <text class="sub" x="220" y="108">PWM --%</text>

  <!-- output matrix -->
  <rect class="panel2" x="8" y="134" width="149" height="82" rx="5"/>
  <text class="value" x="14" y="153">执行器</text>
  <g class="tiny">
    <circle class="green" cx="20" cy="171" r="5"/><text x="30" y="175">进</text>
    <circle cx="64" cy="171" r="5" fill="#315064"/><text x="74" y="175">转</text>
    <circle class="orange" cx="108" cy="171" r="5"/><text x="118" y="175">排</text>
    <circle cx="20" cy="198" r="5" fill="#315064"/><text x="30" y="202">剂</text>
    <circle class="green" cx="64" cy="198" r="5"/><text x="74" y="202">UV</text>
    <circle cx="108" cy="198" r="5" fill="#315064"/><text x="118" y="202">热</text>
  </g>

  <!-- system resources -->
  <rect class="panel2" x="163" y="134" width="149" height="82" rx="5"/>
  <text class="value" x="169" y="153">系统资源</text>
  <text class="tiny" x="169" y="173">内存 38K</text>
  <rect x="169" y="179" width="125" height="9" rx="4" fill="#315064"/>
  <rect x="169" y="179" width="73" height="9" rx="4" fill="#ffb45c"/>
  <text class="sub" x="169" y="207">温湿 --</text>
  <circle class="green" cx="260" cy="202" r="5"/><text class="sub" x="268" y="206">网</text>
  <circle class="green" cx="287" cy="202" r="5"/><text class="sub" x="295" y="206">蓝</text>

  <!-- page indicator, kept below all cards -->
  <rect x="132" y="228" width="14" height="6" rx="2" fill="#2fd7e8"/>
  <rect x="150" y="228" width="8" height="6" rx="2" fill="#315064"/>
  <rect x="168" y="228" width="8" height="6" rx="2" fill="#315064"/>
  <rect x="186" y="228" width="8" height="6" rx="2" fill="#315064"/>
</svg>
